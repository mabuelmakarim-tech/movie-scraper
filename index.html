<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Stream Embed</title>

  <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
  <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />

  <script type="module" src="https://cdn.vidstack.io/player"></script>

  <style>
    /* Reset and make player full viewport */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    media-player {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      
      /* --- UI THEME MATCHING (From your screenshots) --- */
      /* Change the primary brand/progress bar color to match your thin yellow tracker */
      --media-brand: #f5c518; 
      --media-focus-ring: 0 0 0 3px rgba(245, 197, 24, 0.5);
    }

    /* Keep video inside bounds */
    media-provider {
      background-color: #000;
    }

    /* Optional: Custom styling for text tracks/subtitles to match look */
    media-captions {
      margin-bottom: 20px;
      font-size: 1.2rem;
      text-shadow: 0px 2px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <media-player id="embed-player" playsinline>
    <media-provider></media-provider>
    
    <media-video-layout></media-video-layout>
  </media-player>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const player = document.querySelector('#embed-player');

      // Helper function to extract URL parameters if your embed uses them (e.g., embed.html?id=abc)
      function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
      }

      // Automatically fetch stream data from your backend serverless route (api/index.js)
      async function initializePlayback() {
        try {
          const streamId = getQueryParam('id') || ''; 
          
          // Call your serverless Vercel function
          const response = await fetch(`/api/index${streamId ? `?id=${streamId}` : ''}`);
          if (!response.ok) throw new Error('Network response from stream API failed');
          
          const data = await response.json();

          // Make sure your backend json output contains the direct path to the .m3u8 file
          const streamUrl = data.url || data.m3u8 || data.stream; 

          if (streamUrl) {
            // Assign source directly to Vidstack. It will auto-detect HLS and boot up hls.js internally
            player.src = {
              src: streamUrl,
              type: 'application/x-mpegURL'
            };
          } else {
            console.error("API did not return a valid stream URL key.");
          }

        } catch (error) {
          console.error("Failed to load backend stream data from API:", error);
        }
      }

      // Wait until the player core engine is ready before firing the source injection
      player.addEventListener('provider-change', (event) => {
        initializePlayback();
      });
    });
  </script>

</body>
</html>
