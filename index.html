<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Stream Embed</title>

  <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
  <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />

  <script type="module" src="https://cdn.vidstack.io/player"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
    }

    media-player {
      width: 100vw;
      height: 100vh;
      background-color: #000;
      
      /* Match the look from your screenshots */
      --media-brand: #f5c518; /* Thin golden-yellow track accent */
      --media-focus-ring: 0 0 0 3px rgba(245, 197, 24, 0.5);
    }

    media-provider {
      background-color: #000;
    }

    #error-display {
      position: fixed;
      inset: 0;
      background: #000;
      color: #ff4a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 99;
      display: none;
      padding: 20px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="error-display"></div>

  <media-player id="v" playsinline crossorigin>
    <media-provider></media-provider>
    <media-video-layout></media-video-layout>
  </media-player>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const player = document.querySelector('#v');
      const errorDisplay = document.getElementById('error-display');

      function showErr(msg) {
        errorDisplay.textContent = msg;
        errorDisplay.style.display = 'flex';
      }

      // 1. Parse incoming parameters exactly like your old player setup did
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const s  = urlParams.get('s');
      const e  = urlParams.get('e');

      if (!id) {
        showErr("No stream ID specified. Usage: ?id=XYZ or ?id=XYZ&s=1&e=1");
        return;
      }

      // 2. Build backend query mirroring your original app architecture
      const apiEndpoint = '/api?' + (s ? 'id=' + id + '&s=' + s + '&e=' + (e || '1') : 'id=' + id);

      // 3. Fetch stream lookup data and bind securely through proxy wrapper
      async function loadStream() {
        try {
          const response = await fetch(apiEndpoint);
          if (!response.ok) throw new Error('Failed to retrieve data from API stream lookup');
          
          const data = await response.json();
          if (data.error) return showErr(data.error);

          if (data.url) {
            // CRITICAL: Must routing through your backend proxy url wrapper to clear CORS blocks
            const proxiedSrc = '/api?url=' + encodeURIComponent(data.url);

            // Set the source configuration directly inside Vidstack
            player.src = {
              src: proxiedSrc,
              type: 'application/x-mpegURL'
            };
          } else {
            showErr("The backend API route did not return a valid stream stream URL.");
          }
        } catch (err) {
          showErr("Playback Initialization Error: " + err.message);
        }
      }

      // Start stream lookup when player provider engine settles
      player.addEventListener('provider-change', () => {
        loadStream();
      });
    });
  </script>

</body>
</html>
